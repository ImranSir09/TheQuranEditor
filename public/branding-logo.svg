<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Shadow filter for the silhouette -->
    <filter id="mosque-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#003554" flood-opacity="0.45"/>
    </filter>
    <!-- Text outline shadow filter -->
    <filter id="text-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#001824" flood-opacity="0.75"/>
    </filter>
    <path id="curve-text-path" d="M 60,185 C 90,85 240,28 535,185" fill="none" />
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="#0090c5"/>

  <!-- Top Curved Quotation -->
  <text font-family="'Brush Script MT', 'Dancing Script', 'Caveat', 'Segoe Script', cursive, sans-serif" font-size="19" fill="#ffffff" opacity="0.95">
    <textPath href="#curve-text-path" startOffset="0%">
      “Discover the wisdom of the Prophet ﷺ every day with Hadith of the Moment.”
    </textPath>
  </text>

  <!-- Islamic Mosque Silhouette Group -->
  <g fill="#ffffff" filter="url(#mosque-shadow)">
    <!-- 1. Left Minaret Details -->
    <!-- Finial Crescent & Spire -->
    <path d="M 191,85 C 188,81 190,75 194,72 C 191,73 190,78 191,82 C 191,85 193,87 195,88 C 193,87 191,86 191,85 Z" />
    <circle cx="191" cy="91" r="3" />
    <polygon points="190,94 192,94 191.5,102 190.5,102" />
    <circle cx="191" cy="104" r="3.5" />
    <circle cx="191" cy="110" r="2.5" />
    <polygon points="187,117 195,117 193,111 189,111" />
    
    <!-- Upper Minaret Balcony -->
    <rect x="178" y="117" width="26" height="5" rx="1.5" />
    <polygon points="180,122 202,122 198,126 184,126" />
    
    <!-- Upper Cylindrical Shaft with arches -->
    <rect x="181" y="126" width="20" height="42" />
    
    <!-- Mid Balcony with Corbels -->
    <polygon points="174,168 208,168 203,174 179,174" />
    <rect x="173" y="174" width="36" height="6" rx="1.5" />
    
    <!-- Middle Shaft with Verticals -->
    <rect x="178" y="180" width="26" height="68" />
    
    <!-- Lower Balcony -->
    <polygon points="170,248 212,248 206,255 176,255" />
    <rect x="169" y="255" width="44" height="7" rx="1.5" />
    
    <!-- Lower Shaft Section -->
    <rect x="175" y="262" width="32" height="78" />
    
    <!-- Minaret Square Base with Cornice -->
    <polygon points="163,340 219,340 214,346 168,346" />
    <rect x="163" y="346" width="56" height="42" />

    <!-- 2. The Green Dome (Center-Right) -->
    <!-- Dome Spire & Crescent -->
    <circle cx="313" cy="207" r="2.5" />
    <line x1="313" y1="207" x2="313" y2="225" stroke="#ffffff" stroke-width="3" />
    <polygon points="310,216 316,216 314,211 312,211" />

    <!-- Smooth Pointed Dome Body -->
    <path d="M 313,223 
             C 310,236 284,258 254,280 
             C 232,296 226,322 226,358 
             L 400,358 
             C 400,322 394,296 372,280 
             C 342,258 316,236 313,223 Z" />

    <!-- Dome Stepped Drum & Cornices -->
    <rect x="221" y="358" width="184" height="12" rx="2" />
    <rect x="215" y="370" width="196" height="10" rx="1.5" />
    <rect x="212" y="380" width="202" height="8" rx="1" />
  </g>

  <!-- 3. Sweeping Crescent Arch Base -->
  <path d="M 124,495 
           C 126,450 148,398 232,364 
           C 310,332 432,366 480,412 
           C 480,412 432,382 352,382 
           C 246,382 170,424 148,498 
           C 144,507 132,506 124,495 Z" 
        fill="#ffffff" filter="url(#mosque-shadow)" />

  <!-- 4. "HADITH" Display Typography -->
  <g filter="url(#text-outline)">
    <text x="336" y="468" text-anchor="middle" 
          font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" 
          font-weight="900" font-size="70" 
          fill="#ffffff" stroke="#041f30" stroke-width="4.5" 
          paint-order="stroke fill" letter-spacing="3">HADITH</text>
  </g>

  <!-- 5. "OF THE MOMENT" Typography -->
  <g filter="url(#text-outline)">
    <text x="336" y="508" text-anchor="middle" 
          font-family="'Arial Black', 'Impact', sans-serif" 
          font-weight="900" font-size="28" 
          fill="#ffffff" stroke="#041f30" stroke-width="3.5" 
          paint-order="stroke fill" letter-spacing="2.5">OF THE MOMENT</text>
  </g>
</svg>